bundle:
  name: test-databricks

targets:
  dev:
    workspace:
      host: https://dbc-283662bd-ebae.cloud.databricks.com
    mode: development
    default: true

resources:
  jobs:
    sample-job:
      name: "My Sample Job"
      tasks:
        - task_key: "test"
          notebook_task:
            notebook_path: "/Workspace/Shared/test"
          job_cluster_key: "default"
      job_clusters:
        - job_cluster_key: "default"
          new_cluster:
            num_workers: 1
            spark_version: "13.3.x-scala2.12"
            node_type_id: "i3.xlarge"
